name: Kabu Note - Daily Stock Update

on:
  schedule:
    # 平日17時（JST = UTC 08:00）に実行
    # japan-stock-screenerの完了(〜16:30 JST)を待ってから動く必要があるため
    # 16:00→17:00に変更(2026-09-22。銘柄マスタをscreener側から取得する方式に変えたため)
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '読み取りのみ（DBへ書き込まず、実行内容だけログに出す）'
        type: boolean
        default: false

# 同時起動を直列化する（遅延した run が重なっても二重に書き込まない）。
# 処理はデータ基準日(スナップショットの取引日)で冪等だが、配当イベントの
# 検知〜insert は非原子的なため、二重起動を排除しておく。
concurrency:
  group: kabu-note-daily-update
  cancel-in-progress: false

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock update script
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN:                   ${{ inputs.dry_run }}
        run: python scripts/update_stocks.py
